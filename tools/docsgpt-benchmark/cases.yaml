# DocsGPT 问答质量基准 / DocsGPT answer-quality benchmark
#
# 每条用例都带 evidence（文档出处），期望值一律从文档正文抄录，不来自模型回答。
# 用途：升级 DocsGPT、更换 embedding / 检索器 / 分块参数、或重新同步文档之后，
# 跑一遍确认问答链路仍然有效。见同目录 README.md。
#
# 判定约定（详见 README）：
#   cite      检索必须引用到的文件（按 source 路径前缀匹配，全部满足）
#   cite_any  检索引用到其中任意一个文件即可
#   all_of    回答正文必须包含的每一段文字（大小写不敏感的子串匹配）
#   any_of    每个子列表内部是“或”，各子列表之间是“与”
#   none_of   回答正文一旦出现其中任意一段文字即判失败
#   absent    文档里没有答案，期望模型明确说“找不到”，而不是编造内容

target:
  # 问答档（answer）只需要已发布 Agent 的公开 key，它随站点配置一起放在仓库里
  api_host: "https://chenxin199305.tech/fourier/fourier-grx-M4/docsGPT"
  agent_key_from_config: "_config.yaml"
  # 检索档（retrieve）额外需要 DocsGPT 主机上的 JWT 密钥，不从仓库读取
  source_id: "085202e8-aa20-4ca7-9ea9-de0cf52de557"

grading:
  # absent 用例认为“正确拒答”的标志词
  refusal_markers:
    - "没有足够信息"
    - "没有找到"
    - "找不到"
    - "未找到"
    - "没有相关"
    - "没有记录"
    - "资料中没有"
    - "资料里没"
    - "文档中没有"
    - "文档里没"
    - "没有覆盖"
    - "未能找到"
    - "无法确认"
    - "不存在"
    - "尚未发布"
    - "没有这个版本"
    - "no information"
    - "not found"
    - "not documented"
    - "no such"
  # 检索窗口：cite / cite_any 在前 N 个引用里找
  cite_top_k: 20

