title: Fourier-GRX-M4 SDK
description: 开发文档
remote_theme: just-the-docs/just-the-docs

# 文档版本与固件版本（首页与页头版本徽章使用）
doc_version: "v1.2.71"
firmware_version: "4.4.78"
firmware_support: "长期支持"
support_email: "xin.chen@fftai.com"

# 插件配置
plugins:
  - jekyll-relative-links
  - jekyll-remote-theme
  - jekyll-seo-tag

# Logo 配置
logo: "/assets/images/fourier_logo.png"
logo_alt: "Fourier Intelligence"

# 搜索和导航配置
search_enabled: true
search:
  button: false
collapse_navigation: true
navigation_fixed: true
navigation_sticky: true
navigation_fold: true

# 默认布局配置
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# 外部链接配置
aux_links:
  "GitHub 仓库":
    - "//github.com/FFTAI/fourier-grx-M4"
aux_links_new_tab: true

# Markdown 配置
markdown: kramdown
kramdown:
  auto_ids: true
  toc_levels: 2..3  # 正文目录只收录 H2/H3，避免把页面标题本身列进目录
  syntax_highlighter: rouge

# DocsGPT 文档问答机器人
# 发布 DocsGPT Classic Agent 后，在 Access Details 中取得 API key 并填入即可启用；
# api_key 为空且 preview 为 false 时组件不加载。preview 仅用于官方演示 Agent 的界面预览。
# 这里不要填写 Personal Access Token 或模型供应商密钥。
# 自托管 DocsGPT 时把 api_host 改为 API 地址（默认端口为 7091）。
docsgpt:
  api_key: "ebba8fa8-0cd0-4cf6-8f0d-987632ee4e99"
  preview: false
  api_host: "https://chenxin199305.tech/fourier/fourier-grx-M4/docsGPT"
  script_url: "https://unpkg.com/docsgpt@0.13.0/dist/legacy/browser.js"
  avatar: "/assets/images/fourier-f-mark.png"
  button_color: "#7924fd"

# 其他配置
heading_anchors: true
back_to_top: true
back_to_top_text: "返回顶部"
footer_content: "Copyright &copy; Fourier Intelligence"
