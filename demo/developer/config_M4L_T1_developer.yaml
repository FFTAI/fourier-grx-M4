log_level: "none" # 注意: "none" 在 fourier-grx 里表示输出全部日志(TRACE)，不是关闭日志；若只想看报错请改为 "error"

# Control System Layer --------------------------------------------------------
device_connected: true

hardware_type: "X64"
hardware_layer: "fourier-core"

resource:
  path: "~/fourier-grx/resource/m4l"

zenoh:
  authentication: false
  path: "~/fourier-grx/resource/zenoh"

# Robot Layer -----------------------------------------------------------------
peripheral:
  use_joystick: false
  joystick_type: "XBOX"  # support "XBOX", "PS4", "PS5"
  use_keyboard: false
  keyboard_type: "STANDARD"

robot:
  name: "M4LT1"
  backend: "Real"
  control_period: 0.02

# Component Layer -------------------------------------------------------------
actuator:
  comm_enable: [
    # left leg (rotary joint)
    true, true,
    # right leg (rotary joint)
    true, true,
    # left leg (prismatic joint)
    true, true,
    # right leg (prismatic joint)
    true, true
  ]

# Hardware Layer ---------------------------------------------------------------
fi_fsa:
  version: "v2_async"
  data_upload_frequency: 500  # Hz, FSA actuator data upload frequency

# IOBoard 驱动版本必须显式指定；缺省时 fourier-core 会退回同步版 fi_ioboard_v1，
# 与 M4L 正式配置使用的异步版不一致
fi_ioboard:
  version: "v1_async"
  expected_firmware_version: "1.0.0.2"  # IOBoard expected firmware version
  data_upload_frequency: 1  # Hz, IOBoard data upload frequency
